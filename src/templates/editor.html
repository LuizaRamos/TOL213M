<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>{{ "Edit text" if viewing else "Create text" }}</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
    .row { margin-bottom: 14px; }
    label { display:block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 14px; }
    textarea { width: 100%; padding: 10px; font-size: 14px; resize: vertical; }
    .btnrow { display:flex; gap: 10px; margin-top: 14px; }
    .muted { color:#666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">

    <h2 style="margin-top:0;">
      {{ "Edit text" if viewing else "Create text" }}
    </h2>

    <p class="muted">
      Your text will be encrypted before being stored in the database.
    </p>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: #b00020;">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <!-- Save goes to your existing POST /upload -->
    <form method="post" action="{{ url_for('text_controller.upload') }}">
      <div class="row">
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          name="title"
          value="{{ title if title else '' }}"
          placeholder="e.g., Meeting notes"
          required
        />
      </div>

      <div class="row">
        <label for="content">Text</label>
        <textarea
          id="content"
          name="content"
          rows="14"
          placeholder="Write your text here..."
          required
        >{{ content if content else '' }}</textarea>
      </div>

      <div class="btnrow">
        <button type="submit">
          Save encrypted
        </button>

        <a href="{{ url_for('text_controller.dashboard') }}">
          <button type="button">Cancel</button>
        </a>
      </div>
    </form>

  </div>
</body>
</html>
