<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { text-align: center; }
        .form-container { display: inline-block; text-align: left; }
        .form-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin: 8px 0;
        }
        .form-row label {
            width: 150px;
            text-align: right;
            margin-right: 10px;
        }
        .error {
            color: red;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Create Account</h1>

<form method="post" action="{{ url_for('user_controller.register_submit') }}" onsubmit="return validateForm()">
    <div class="form-container">

        <div class="form-row">
            <label>Name:</label>
            <input type="username" name="username" required />
        </div>

        <div class="form-row">
            <label>Email:</label>
            <input type="email" name="email" required />
        </div>

        <div class="form-row">
            <label>Password:</label>
            <input type="password" id="password" name="password" required
                   minlength="8"
                   pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$"
                   title="Password must be at least 8 characters, include 1 uppercase letter, 1 lowercase letter, and 1 number." />
        </div>

        <div class="form-row">
            <label>Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required />
        </div>

        <div class="error" id="error_message"></div>

        <div style="text-align:center; margin-top:15px;">
            <button type="submit">Create Account</button>
        </div>

    </div>
</form>

<br>
<a href="{{ url_for('home_controller.index') }}">Back to Login</a>

<script>
function validateForm() {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;
    const errorMessage = document.getElementById("error_message");

    errorMessage.textContent = "";

    // Check if passwords match
    if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match.";
        return false;
    }

    // Check password complexity (JS fallback in addition to HTML pattern)
    const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
    if (!regex.test(password)) {
        errorMessage.textContent =
            "Password must be at least 8 characters long and include uppercase, lowercase, and a number.";
        return false;
    }

    return true;
}
</script>

</body>
</html>
