{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Register</h1>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required />
    <label>Password (min 8 chars)</label>
    <input type="password" name="password" required minlength="8" />
    <button type="submit">Create account</button>
  </form>
{% endblock %}
